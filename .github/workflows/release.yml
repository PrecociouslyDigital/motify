on: 
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

name: Build and Release

jobs:
  build:
    name: Build binaries
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            platform: ubuntu-latest
            name: motify
          - target: x86_64-pc-windows-msvc
            platform: windows-latest
            name: motify.exe
          - target: x86_64-apple-darwin
            platform: macos-latest
            name: motify-macos
          - target: aarch64-apple-darwin
            platform: macos-latest
            name: motify-macos-silicon
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build Artifact
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Rename Mac releases
        if: ${{ contains(matrix.target, 'apple-darwin') }}
        run: mv target/${{ matrix.target }}/release/motify target/${{ matrix.target }}/release/${{ matrix.name }}
        shell: bash
      - name: Upload release
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: target/${{ matrix.target }}/release/${{ matrix.name }}
  release:
    name: Release binaries on github
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.PAT_GITHUB }}"
          automatic_release_tag: "latest"
          prerelease: false
          title: "Latest Release Builds"
          files: |
            motify
            motify.exe
            motify-macos
            motify-macos-silicon
