[package]
name = "motify"
version = "1.0.0"
authors = ["Precociouslydigital <fellfromatree@gmail.com>"]
edition = "2024"
rust-version = "1.89"
description = "Declaratively manage your symlinks"
readme = "README.md"

[dependencies]
bunt = "0.2.9"
clap = { version = "4.6", features = ["derive"] }
home = "0.5"
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1.3"
shellexpand = "3.1"
symlink = "0.1.0"
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
